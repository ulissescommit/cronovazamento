[project]
name = "cronovazamento"
version = "0.1.0"
description = "Datação e atribuição de origem de vazamentos de dados por características mutáveis de tabelas de referência"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "cryptography>=42",
]
# drivers dos motores externos suportados pelo conector (cronovazamento/conectores.py)
conectores = [
    "pymysql>=1.1",       # mysql, mariadb
    "pymssql>=2.3",       # sql server
    "oracledb>=2.0",      # oracle (modo thin, sem Oracle Instant Client)
    "pymongo>=4.7",       # mongodb
]

[project.scripts]
cronovazamento = "cronovazamento.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cronovazamento*"]
